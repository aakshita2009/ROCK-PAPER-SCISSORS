<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <style>
:root {
  --bg: #14213d;
  --panel: #1d2e52;
  --ink: #f4f6fb;
  --muted: #a9b4cf;
  --win: #3ddc97;
  --lose: #ff6b6b;
  --draw: #ffd166;
  --line: #31446f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  display: flex;
  justify-content: center;
}

.game {
  width: 100%;
  max-width: 560px;
  padding: 2rem 1.25rem 3rem;
  text-align: center;
}

h1 { margin: 0 0 .3rem; font-size: clamp(1.8rem, 6vw, 2.5rem); letter-spacing: .01em; }
h2 { font-size: 1rem; margin: 0 0 .6rem; color: var(--muted); font-weight: 600; }
.hint { margin: 0 0 1.5rem; color: var(--muted); font-size: .92rem; }
kbd {
  background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 .35rem; font-family: inherit; font-size: .85em;
}

/* Scoreboard */
.scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
.score { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .8rem .4rem; }
.score .num { display: block; font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.score .who { color: var(--muted); font-size: .85rem; }
.score.you { border-bottom: 4px solid var(--win); }
.score.draw { border-bottom: 4px solid var(--draw); }
.score.cpu { border-bottom: 4px solid var(--lose); }
.num.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* Arena */
.arena { display: flex; align-items: center; justify-content: center; gap: 1.2rem; margin-bottom: 1rem; }
.hand {
  width: 110px; height: 110px; border-radius: 50%;
  display: grid; place-items: center; font-size: 3.4rem;
  background: var(--panel); border: 3px solid var(--line);
  transition: border-color .2s, background .2s;
}
.hand.win { border-color: var(--win); background: rgba(61, 220, 151, .15); }
.hand.lose { border-color: var(--lose); background: rgba(255, 107, 107, .12); }
.hand.draw { border-color: var(--draw); }
.hand.shake { animation: shake .45s ease; }
@keyframes shake { 25% { transform: translateY(-10px); } 75% { transform: translateY(6px); } }
.caption { display: block; margin-top: .4rem; color: var(--muted); font-size: .9rem; }
.versus { color: var(--muted); font-style: italic; }

.result { min-height: 2.2rem; font-size: 1.3rem; font-weight: 700; margin: 0 0 1.3rem; }
.result.win { color: var(--win); }
.result.lose { color: var(--lose); }
.result.draw { color: var(--draw); }

/* Buttons */
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.8rem; }
.choice {
  font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
  padding: .9rem .3rem; transition: transform .1s, border-color .15s, background .15s;
}
.choice .icon { display: block; font-size: 2.2rem; margin-bottom: .2rem; }
.choice:hover { border-color: var(--draw); background: #243864; }
.choice:active { transform: scale(.96); }
.choice:focus-visible, .reset:focus-visible { outline: 3px solid var(--draw); outline-offset: 2px; }

/* History */
.history-wrap { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.5rem; }
.history { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.history li:last-child { border-bottom: 0; }
.history .empty { color: var(--muted); }
.tag { font-weight: 700; }
.tag.win { color: var(--win); } .tag.lose { color: var(--lose); } .tag.draw { color: var(--draw); }

.reset {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
  background: transparent; border: 2px solid var(--line); border-radius: 8px; padding: .6rem 1.4rem;
}
.reset:hover { border-color: var(--lose); }

@media (max-width: 420px) {
  .hand { width: 88px; height: 88px; font-size: 2.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>
    <p class="hint">Pick your move. You can also press <kbd>R</kbd>, <kbd>P</kbd> or <kbd>S</kbd>.</p>

    <section class="scoreboard" aria-label="Score">
      <div class="score you"><span class="num" id="score-player">0</span><span class="who">You</span></div>
      <div class="score draw"><span class="num" id="score-draw">0</span><span class="who">Draws</span></div>
      <div class="score cpu"><span class="num" id="score-computer">0</span><span class="who">Computer</span></div>
    </section>

    <section class="arena" aria-live="polite">
      <div class="side">
        <div class="hand" id="player-hand" aria-hidden="true">?</div>
        <span class="caption">You</span>
      </div>
      <div class="versus">vs</div>
      <div class="side">
        <div class="hand" id="computer-hand" aria-hidden="true">?</div>
        <span class="caption">Computer</span>
      </div>
    </section>

    <p class="result" id="result">Choose rock, paper or scissors to start.</p>

    <section class="choices" aria-label="Your choices">
      <button class="choice" data-choice="rock"><span class="icon">✊</span>Rock</button>
      <button class="choice" data-choice="paper"><span class="icon">✋</span>Paper</button>
      <button class="choice" data-choice="scissors"><span class="icon">✌️</span>Scissors</button>
    </section>

    <section class="history-wrap">
      <h2>Last rounds</h2>
      <ol id="history" class="history"><li class="empty">No rounds played yet.</li></ol>
    </section>

    <button class="reset" id="reset" type="button">Reset score</button>
  </main>

  <script>
(function () {
  "use strict";

  var CHOICES = ["rock", "paper", "scissors"];
  var ICONS = { rock: "✊", paper: "✋", scissors: "✌️" };
  var BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
  var MAX_HISTORY = 5;

  /* Pure game logic: returns "win", "lose" or "draw" from the player's view */
  function decide(player, computer) {
    if (player === computer) return "draw";
    return BEATS[player] === computer ? "win" : "lose";
  }

  function randomChoice() {
    return CHOICES[Math.floor(Math.random() * CHOICES.length)];
  }

  var score = { win: 0, draw: 0, lose: 0 };
  var history = [];

  var el = {
    player: document.getElementById("score-player"),
    draw: document.getElementById("score-draw"),
    computer: document.getElementById("score-computer"),
    playerHand: document.getElementById("player-hand"),
    computerHand: document.getElementById("computer-hand"),
    result: document.getElementById("result"),
    history: document.getElementById("history"),
    reset: document.getElementById("reset")
  };

  var MESSAGES = {
    win: "You win this round!",
    lose: "Computer wins this round.",
    draw: "It's a draw."
  };

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function bump(node) {
    node.classList.remove("bump");
    void node.offsetWidth;            // restart the animation
    node.classList.add("bump");
  }

  function play(playerChoice) {
    var computerChoice = randomChoice();
    var outcome = decide(playerChoice, computerChoice);

    score[outcome]++;
    history.unshift({ p: playerChoice, c: computerChoice, o: outcome });
    if (history.length > MAX_HISTORY) history.pop();

    render(playerChoice, computerChoice, outcome);
  }

  function render(p, c, outcome) {
    el.playerHand.textContent = ICONS[p];
    el.computerHand.textContent = ICONS[c];

    ["win", "lose", "draw", "shake"].forEach(function (cls) {
      el.playerHand.classList.remove(cls);
      el.computerHand.classList.remove(cls);
      el.result.classList.remove(cls);
    });
    void el.playerHand.offsetWidth;
    el.playerHand.classList.add("shake", outcome === "win" ? "win" : outcome === "lose" ? "lose" : "draw");
    el.computerHand.classList.add("shake", outcome === "lose" ? "win" : outcome === "win" ? "lose" : "draw");

    el.result.textContent = capitalize(p) + " vs " + capitalize(c) + ": " + MESSAGES[outcome];
    el.result.classList.add(outcome);

    el.player.textContent = score.win;
    el.draw.textContent = score.draw;
    el.computer.textContent = score.lose;
    bump(outcome === "win" ? el.player : outcome === "lose" ? el.computer : el.draw);

    renderHistory();
  }

  function renderHistory() {
    el.history.innerHTML = "";
    if (!history.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No rounds played yet.";
      el.history.appendChild(li);
      return;
    }
    history.forEach(function (r) {
      var li = document.createElement("li");
      var left = document.createElement("span");
      var right = document.createElement("span");
      left.textContent = ICONS[r.p] + " " + capitalize(r.p) + " vs " + ICONS[r.c] + " " + capitalize(r.c);
      right.className = "tag " + r.o;
      right.textContent = r.o === "win" ? "You won" : r.o === "lose" ? "You lost" : "Draw";
      li.appendChild(left);
      li.appendChild(right);
      el.history.appendChild(li);
    });
  }

  function resetGame() {
    score = { win: 0, draw: 0, lose: 0 };
    history = [];
    el.player.textContent = el.draw.textContent = el.computer.textContent = "0";
    el.playerHand.textContent = el.computerHand.textContent = "?";
    ["win", "lose", "draw", "shake"].forEach(function (cls) {
      el.playerHand.classList.remove(cls);
      el.computerHand.classList.remove(cls);
      el.result.classList.remove(cls);
    });
    el.result.textContent = "Score reset. Choose rock, paper or scissors.";
    renderHistory();
  }

  document.querySelectorAll(".choice").forEach(function (btn) {
    btn.addEventListener("click", function () { play(btn.dataset.choice); });
  });

  el.reset.addEventListener("click", resetGame);

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var map = { r: "rock", p: "paper", s: "scissors" };
    var choice = map[e.key.toLowerCase()];
    if (choice) play(choice);
  });
})();

</script>
</body>
</html>
